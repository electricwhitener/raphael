# Stage 14 check: can the C toolchain Raphael will bundle on Windows (WinLibs) trace a program?
# Its gdb must have Python inside, because Raphael's tracer is a Python script that runs in gdb.
# (w64devkit 2.11.0's gdb 18.1 has none, so it was dropped on 2026-11-11.)
# Started by hand only (Actions → toolchain → Run workflow), since it downloads about 110 MB.
name: toolchain

on:
  workflow_dispatch:

jobs:
  windows-gdb:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      WINLIBS: 16.2.0posix-23.1.3-14.0.0-ucrt-r3
      FILE: winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.7z
      SHA256: db014a73b71907c6c778fd1c938056cddcae9023f89f8dfff7783d9e45baf975
    steps:
      - uses: actions/checkout@v4
      - name: Download WinLibs and check its SHA-256
        run: |
          curl -sSL -o winlibs.7z "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS/$FILE"
          echo "$SHA256  winlibs.7z" | sha256sum -c
          7z x -y -o"$RUNNER_TEMP" winlibs.7z > /dev/null
          echo "$RUNNER_TEMP/mingw64/bin" >> "$GITHUB_PATH"
          du -sh "$RUNNER_TEMP/mingw64"
      - name: Versions, and Python inside gdb
        run: |
          gcc --version | head -1
          gdb --version | head -1
          gdb -q -batch -nx -ex "python import sys; print('gdb has Python', sys.version)"
      - name: Trace the spike's linked list
        working-directory: .claude/tools/cspike
        run: |
          gcc -g -O0 -fno-inline -o list.exe list.c
          RAPHAEL_OUT=steps.jsonl gdb -q -batch -nx -x spike.py ./list.exe
          python check.py steps.jsonl
      - name: Keep the steps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-steps
          path: .claude/tools/cspike/steps.jsonl
