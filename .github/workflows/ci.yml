# Runs every test on a fresh Windows, macOS and Linux machine, on every push and pull request.
# This is how Raphael is checked on systems the developer doesn't own.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch: # a "Run workflow" button on GitHub

jobs:
  test:
    strategy:
      fail-fast: false # finish all three, so one failure doesn't hide another
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # C runs through gdb with Python inside (Stage 14). Linux gets the distribution's gdb; Windows the
      # WinLibs toolchain Raphael will bundle (the image's own gdb has no Python), cached between runs.
      - name: gdb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q gdb
      - name: WinLibs cache (Windows)
        if: runner.os == 'Windows'
        id: winlibs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mingw64
          key: winlibs-16.2.0posix-23.1.3-14.0.0-ucrt-r3
      - name: WinLibs (Windows)
        if: runner.os == 'Windows' && steps.winlibs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -sSL -o winlibs.7z "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.7z"
          echo "db014a73b71907c6c778fd1c938056cddcae9023f89f8dfff7783d9e45baf975  winlibs.7z" | sha256sum -c
          7z x -y -o"$RUNNER_TEMP" winlibs.7z > /dev/null
          rm winlibs.7z
      - name: WinLibs on the PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$RUNNER_TEMP/mingw64/bin" >> "$GITHUB_PATH"
      # Linux runners have no screen, and some tests open Swing windows, so give them a virtual one.
      - name: Test (Linux, virtual screen)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum mvn -B test
      - name: Test
        if: runner.os != 'Linux'
        run: mvn -B test
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports/
